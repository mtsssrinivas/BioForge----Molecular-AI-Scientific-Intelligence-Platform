services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: bioforge-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-bioforge_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-bioforge_secure_password}
      POSTGRES_DB: ${POSTGRES_DB:-bioforge}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bioforge_user -d bioforge"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: bioforge-redis
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: .
      dockerfile: docker/Dockerfile.backend
    container_name: bioforge-backend
    environment:
      - ENVIRONMENT=production
      - DATABASE_URL=postgresql+psycopg2://${POSTGRES_USER:-bioforge_user}:${POSTGRES_PASSWORD:-bioforge_secure_password}@postgres:5432/${POSTGRES_DB:-bioforge}
      - REDIS_URL=redis://redis:6379/0
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/0
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  worker:
    build:
      context: .
      dockerfile: docker/Dockerfile.worker
    container_name: bioforge-worker
    environment:
      - DATABASE_URL=postgresql+psycopg2://${POSTGRES_USER:-bioforge_user}:${POSTGRES_PASSWORD:-bioforge_secure_password}@postgres:5432/${POSTGRES_DB:-bioforge}
      - REDIS_URL=redis://redis:6379/0
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/0
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy

  frontend:
    build:
      context: .
      dockerfile: docker/Dockerfile.frontend
    container_name: bioforge-frontend
    ports:
      - "3000:80"
    depends_on:
      - backend

volumes:
  postgres_data:
